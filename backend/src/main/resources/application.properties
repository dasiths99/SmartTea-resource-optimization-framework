server.port=8080
spring.application.name=smarttea-c04-backend

# MongoDB: set the MONGODB_URI environment variable (e.g. your MongoDB Atlas link).
# It is read from the project-root .env file (git-ignored) or the environment; falls back to a local MongoDB.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/smarttea_c04}
spring.data.mongodb.database=${MONGODB_DATABASE:smarttea_c04}
spring.data.mongodb.auto-index-creation=true

# All API JSON in snake_case (same field names as the IoT device and the ML service)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# Internal Python ML service (FastAPI)
smarttea.ml-url=${ML_URL:http://localhost:8000}
# Open-Meteo forecast (free, no key). past_days gives the last month of weather the models need.
smarttea.forecast-url=https://api.open-meteo.com/v1/forecast
smarttea.forecast-cache-minutes=60
# Hourly re-recommendation job (top of every hour)
smarttea.hourly-cron=0 0 * * * *
# Dashboard origins allowed to call the API (patterns): the React dev server on localhost or 127.0.0.1, any port
smarttea.cors-origins=http://localhost:*,http://127.0.0.1:*
